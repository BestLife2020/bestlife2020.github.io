name: Update Market Indicators

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-indicators:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance

      - name: Fetch indicators
        env:
          # 선택사항: 등록하면 BLS 요청 한도가 25회/일 → 500회/일로 늘어납니다.
          # 발급: https://data.bls.gov/registrationEngine/
          # 등록 후 리포 Settings > Secrets and variables > Actions 에 BLS_API_KEY로 추가하세요.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python fetch_indicators.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/indicators.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update market indicators"
            git push
          fi
