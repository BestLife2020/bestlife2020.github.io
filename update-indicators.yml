name: Update Macro Indicators

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 UTC 21:00 (한국시간 오전 6시)
  workflow_dispatch: {}     # 수동 실행 버튼도 사용 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch indicators
        run: python scripts/fetch_indicators.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indicators.json
          git diff --cached --quiet || git commit -m "chore: update macro indicators ($(date -u +%Y-%m-%d))"
          git push
