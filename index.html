<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실시간 뉴스 & Nasdaq</title>
<style>
:root{
  --bg:#0b0f19;
  --card:#151c2c;
  --border:#263149;
  --active:#2d3a57;
  --text:#f1f5f9;
  --sub:#94a3b8;
  --accent:#818cf8;
  --up:#f87171;
  --down:#60a5fa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:18px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  padding-bottom:15px;
  margin-bottom:16px;
}
h1{font-size:1.25rem}
.update{
  color:var(--sub);
  font-size:.78rem;
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:8px;
}
.category-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.category{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:999px;
  padding:8px 14px;
  cursor:pointer;
  font-size:.85rem;
  font-weight:700;
}
.category.active{
  background:var(--active);
  border-color:var(--accent);
}
.category span{
  color:var(--accent);
  margin-left:4px;
}
.main{
  display:grid;
  grid-template-columns:1.25fr 1fr;
  gap:16px;
}
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  padding:16px;
  min-width:0;
}
.panel-title{
  font-weight:700;
  padding-bottom:11px;
  border-bottom:1px solid var(--border);
  margin-bottom:12px;
}
.news-list{
  display:flex;
  flex-direction:column;
  gap:9px;
  max-height:650px;
  overflow:auto;
}
.news{
  display:block;
  text-decoration:none;
  color:inherit;
  border:1px solid var(--border);
  border-radius:9px;
  padding:11px;
}
.news:hover{
  border-color:var(--accent);
  background:rgba(255,255,255,.03);
}
.news-title{
  font-size:.9rem;
  font-weight:700;
  line-height:1.4;
}
.news-summary{
  color:var(--sub);
  font-size:.76rem;
  line-height:1.45;
  margin-top:5px;
}
.news-meta{
  color:var(--accent);
  font-size:.68rem;
  margin-top:6px;
}
.stock-list{
  display:flex;
  flex-direction:column;
  gap:7px;
}
.stock-row{
  display:grid;
  grid-template-columns:1.15fr .65fr .85fr 1fr 1fr;
  align-items:center;
  gap:6px;
  border:1px solid var(--border);
  border-radius:8px;
  padding:9px 8px;
  font-size:.76rem;
}
.stock-row.header-row{
  border:none;
  color:var(--sub);
  padding:2px 8px 5px;
}
.stock-name{
  font-weight:700;
  color:#fff;
}
.stock-symbol{
  color:var(--sub);
  font-size:.65rem;
  margin-left:3px;
}
.num{text-align:right}
.up{color:var(--up);font-weight:700}
.down{color:var(--down);font-weight:700}
.na{color:var(--sub)}
.status{
  color:var(--sub);
  font-size:.7rem;
  margin-top:9px;
}
@media(max-width:1000px){
  .main{grid-template-columns:1fr}
}
@media(max-width:650px){
  body{padding:10px}
  .stock-row{
    grid-template-columns:1.2fr .7fr .8fr 1fr 1fr;
    font-size:.68rem;
    padding:8px 5px;
  }
  .stock-symbol{display:none}
  .panel{padding:11px}
}
</style>
</head>
<body>

<div class="header">
  <h1>📡 실시간 뉴스 & Nasdaq</h1>
  <div class="update" id="updateTime">Update : --</div>
</div>

<div class="category-row" id="categories"></div>

<div class="main">
  <section class="panel">
    <div class="panel-title" id="newsTitle">📰 뉴스</div>
    <div class="news-list" id="newsList"></div>
    <div class="status" id="newsStatus"></div>
  </section>

  <section class="panel">
    <div class="panel-title">📈 Nasdaq 종목</div>

    <div class="stock-row header-row">
      <div>종목</div>
      <div class="num">상승률</div>
      <div class="num">주가</div>
      <div class="num">매출</div>
      <div class="num">영업이익</div>
    </div>

    <div class="stock-list" id="stockList"></div>
    <div class="status" id="stockStatus"></div>
  </section>
</div>

<script>
let newsData = null;
let stockData = null;
let activeCategory = "ai";

const categoryOrder = [
  ["ai","AI"],
  ["semiconductor","반도체"],
  ["quantum","양자"],
  ["space","우주항공"],
  ["robotics","로봇"],
  ["energy","에너지"],
  ["bigtech","빅테크"]
];

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function fmtPrice(v){
  if(v === null || v === undefined) return "-";
  return "$" + Number(v).toLocaleString("en-US",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });
}

function fmtBillions(v){
  if(v === null || v === undefined) return "-";
  return "$" + (Number(v)/1e9).toFixed(2) + "B";
}

function fmtChange(v){
  if(v === null || v === undefined) return "-";
  const n = Number(v);
  return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
}

function renderCategories(){
  const el = document.getElementById("categories");
  el.innerHTML = "";

  categoryOrder.forEach(([id,title])=>{
    const data = newsData?.categories?.[id];
    const count = data?.count ?? 0;

    const div = document.createElement("div");
    div.className = "category" + (id === activeCategory ? " active" : "");
    div.innerHTML = `${title}<span>(${count})</span>`;
    div.onclick = ()=>{
      activeCategory = id;
      renderCategories();
      renderNews();
    };
    el.appendChild(div);
  });
}

function renderNews(){
  const data = newsData?.categories?.[activeCategory];
  const title = data?.title || "뉴스";
  const list = data?.news || [];

  document.getElementById("newsTitle").textContent =
    `📰 ${title} 뉴스 (${list.length}건)`;

  const el = document.getElementById("newsList");
  el.innerHTML = "";

  if(!list.length){
    el.innerHTML = `<div class="status">현재 뉴스가 없습니다.</div>`;
    return;
  }

  list.forEach(item=>{
    const a = document.createElement("a");
    a.className = "news";
    a.href = item.url || "#";
    a.target = "_blank";
    a.rel = "noopener noreferrer";

    a.innerHTML = `
      <div class="news-title">${escapeHtml(item.title)}</div>
      <div class="news-summary">${escapeHtml(item.summary)}</div>
      <div class="news-meta">
        ${escapeHtml(item.press)} · ${escapeHtml(item.time)}
      </div>
    `;

    el.appendChild(a);
  });
}

function renderStocks(){
  const el = document.getElementById("stockList");
  el.innerHTML = "";

  const stocks = (stockData?.stocks || [])
    .filter(s => {
      if(activeCategory === "ai") return s.category === "AI";
      if(activeCategory === "semiconductor") return s.category === "반도체";
      if(activeCategory === "quantum") return s.category === "양자";
      if(activeCategory === "space") return s.category === "우주항공";
      if(activeCategory === "robotics") return s.category === "로봇";
      if(activeCategory === "energy") return s.category === "에너지";
      if(activeCategory === "bigtech") return s.category === "빅테크";
      return true;
    });

  stocks.forEach(s=>{
    const row = document.createElement("div");
    row.className = "stock-row";

    const change = Number(s.change);
    const changeClass =
      Number.isFinite(change) ? (change >= 0 ? "up" : "down") : "na";

    row.innerHTML = `
      <div class="stock-name">
        ${escapeHtml(s.name)}
        <span class="stock-symbol">${escapeHtml(s.symbol)}</span>
      </div>
      <div class="num ${changeClass}">${fmtChange(s.change)}</div>
      <div class="num">${fmtPrice(s.price)}</div>
      <div class="num">${fmtBillions(s.revenue)}</div>
      <div class="num">${fmtBillions(s.operatingIncome)}</div>
    `;

    el.appendChild(row);
  });
}

function updateStatus(){
  const newsTime = newsData?.updated
    ? new Date(newsData.updated).toLocaleString("ko-KR",{hour12:false})
    : "-";

  const stockTime = stockData?.updated
    ? new Date(stockData.updated).toLocaleString("ko-KR",{hour12:false})
    : "-";

  document.getElementById("newsStatus").textContent =
    `뉴스 API: ${newsData?.provider || "-"} · 데이터: ${newsTime}`;

  document.getElementById("stockStatus").textContent =
    `주가/실적 데이터: ${stockTime}`;
}

async function loadData(){
  try{
    const [newsRes, stockRes] = await Promise.all([
      fetch("./data/news.json?ts=" + Date.now(), {cache:"no-store"}),
      fetch("./data/stocks.json?ts=" + Date.now(), {cache:"no-store"})
    ]);

    if(!newsRes.ok) throw new Error("news.json " + newsRes.status);
    if(!stockRes.ok) throw new Error("stocks.json " + stockRes.status);

    newsData = await newsRes.json();
    stockData = await stockRes.json();

    renderCategories();
    renderNews();
    renderStocks();
    updateStatus();

    document.getElementById("updateTime").textContent =
      "Update : " + new Date().toLocaleString("ko-KR",{hour12:false});

  }catch(error){
    console.error(error);
    document.getElementById("newsList").innerHTML =
      `<div class="status">데이터를 불러오지 못했습니다: ${escapeHtml(error.message)}</div>`;
  }
}

function clock(){
  document.getElementById("updateTime").textContent =
    "Update : " + new Date().toLocaleString("ko-KR",{hour12:false});
}

window.addEventListener("load", loadData);
setInterval(loadData, 600000);
setInterval(clock, 1000);
</script>

</body>
</html>
