<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>실시간 뉴스 & Nasdaq</title>
<style>
:root{--bg:#0b0f19;--card:#151c2c;--border:#263149;--active:#2d3a57;--text:#f1f5f9;--sub:#94a3b8;--accent:#818cf8;--up:#f87171;--down:#60a5fa}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);padding:18px}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:15px;margin-bottom:16px}h1{font-size:1.25rem}.update{color:var(--sub);font-size:.78rem;padding:6px 10px;border:1px solid var(--border);border-radius:8px}
.category-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.category{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.85rem;font-weight:700}.category.active{background:var(--active);border-color:var(--accent)}.category span{color:var(--accent);margin-left:4px}
.main{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}.panel{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px;min-width:0}.panel-title{font-weight:700;padding-bottom:11px;border-bottom:1px solid var(--border);margin-bottom:12px}
.news-list{display:flex;flex-direction:column;gap:9px;max-height:650px;overflow:auto}.news{display:block;text-decoration:none;color:inherit;border:1px solid var(--border);border-radius:9px;padding:11px}.news:hover{border-color:var(--accent);background:rgba(255,255,255,.03)}.news-title{font-size:.9rem;font-weight:700;line-height:1.4}.news-summary{color:var(--sub);font-size:.76rem;line-height:1.45;margin-top:5px}.news-meta{color:var(--accent);font-size:.68rem;margin-top:6px}
.stock-list{display:flex;flex-direction:column;gap:7px}.stock-row{display:grid;grid-template-columns:1.15fr .65fr .85fr 1fr 1fr;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:9px 8px;font-size:.76rem}.stock-row.header-row{border:none;color:var(--sub);padding:2px 8px 5px}.stock-name{font-weight:700}.stock-symbol{color:var(--sub);font-size:.65rem;margin-left:3px}.num{text-align:right}.up{color:var(--up);font-weight:700}.down{color:var(--down);font-weight:700}.na{color:var(--sub)}.status{color:var(--sub);font-size:.7rem;margin-top:9px}.error{color:#fca5a5}.ok{color:#86efac}
@media(max-width:1000px){.main{grid-template-columns:1fr}}@media(max-width:650px){body{padding:10px}.stock-row{grid-template-columns:1.2fr .7fr .8fr 1fr 1fr;font-size:.68rem;padding:8px 5px}.stock-symbol{display:none}.panel{padding:11px}}
</style></head><body>
<div class="header"><h1>📡 실시간 뉴스 & Nasdaq</h1><div class="update" id="updateTime">Update : --</div></div>
<div class="category-row" id="categories"></div>
<div class="main"><section class="panel"><div class="panel-title" id="newsTitle">📰 뉴스</div><div class="news-list" id="newsList"></div><div class="status" id="newsStatus"></div></section>
<section class="panel"><div class="panel-title">📈 Nasdaq 종목</div><div class="stock-row header-row"><div>종목</div><div class="num">상승률</div><div class="num">주가</div><div class="num">매출</div><div class="num">영업이익</div></div><div class="stock-list" id="stockList"></div><div class="status" id="stockStatus"></div></section></div>
<script>
let newsData=null,stockData=null,activeCategory="ai";
const categoryOrder=[["ai","AI"],["semiconductor","반도체"],["quantum","양자"],["space","우주항공"],["robotics","로봇"],["energy","에너지"],["bigtech","빅테크"]];
const catMap={ai:"AI",semiconductor:"반도체",quantum:"양자",space:"우주항공",robotics:"로봇",energy:"에너지",bigtech:"빅테크"};
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function price(v){return v==null||!Number.isFinite(Number(v))?"-":"$"+Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function bill(v){return v==null||!Number.isFinite(Number(v))?"-":"$"+(Number(v)/1e9).toFixed(2)+"B"}
function change(v){if(v==null||!Number.isFinite(Number(v)))return"-";let n=Number(v);return(n>=0?"+":"")+n.toFixed(2)+"%"}
function time(v){if(!v)return"-";let d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleString("ko-KR",{hour12:false})}
function renderCategories(){let e=document.getElementById("categories");e.innerHTML="";categoryOrder.forEach(([id,t])=>{let d=document.createElement("div");d.className="category"+(id===activeCategory?" active":"");d.innerHTML=`${t}<span>(${newsData?.categories?.[id]?.count??0})</span>`;d.onclick=()=>{activeCategory=id;renderCategories();renderNews();renderStocks()};e.appendChild(d)})}
function renderNews(){let d=newsData?.categories?.[activeCategory],list=d?.news||[];document.getElementById("newsTitle").textContent=`📰 ${d?.title||"뉴스"} 뉴스 (${list.length}건)`;let e=document.getElementById("newsList");e.innerHTML="";if(!list.length){e.innerHTML='<div class="status">현재 뉴스가 없습니다.</div>';return}list.forEach(x=>{let a=document.createElement("a");a.className="news";a.href=x.url||"#";a.target="_blank";a.rel="noopener noreferrer";a.innerHTML=`<div class="news-title">${esc(x.title)}</div><div class="news-summary">${esc(x.summary||"")}</div><div class="news-meta">${esc(x.press||"")} · ${esc(x.time||"")}</div>`;e.appendChild(a)})}
function renderStocks(){let e=document.getElementById("stockList");e.innerHTML="";(stockData?.stocks||[]).filter(x=>x.category===catMap[activeCategory]).forEach(s=>{let r=document.createElement("div");r.className="stock-row";let n=Number(s.change),c=Number.isFinite(n)?n>=0?"up":"down":"na";r.innerHTML=`<div class="stock-name">${esc(s.name)} <span class="stock-symbol">${esc(s.symbol)}</span></div><div class="num ${c}">${change(s.change)}</div><div class="num">${price(s.price)}</div><div class="num">${bill(s.revenue)}</div><div class="num">${bill(s.operatingIncome)}</div>`;e.appendChild(r)})}
function updateStatus(){let n=Object.values(newsData?.categories||{}).some(x=>(x.news||[]).length),s=(stockData?.stocks||[]).some(x=>x.price!=null);let a=document.getElementById("newsStatus"),b=document.getElementById("stockStatus");a.className="status "+(n?"ok":"error");a.textContent=`뉴스: ${newsData?.provider||"-"} · 데이터: ${time(newsData?.updated)}`;b.className="status "+(s?"ok":"error");b.textContent=`주가/실적 데이터: ${time(stockData?.updated)}`}
async function loadData(){try{let[a,b]=await Promise.all([fetch("./data/news.json?ts="+Date.now(),{cache:"no-store"}),fetch("./data/stocks.json?ts="+Date.now(),{cache:"no-store"})]);if(!a.ok)throw Error("news.json "+a.status);if(!b.ok)throw Error("stocks.json "+b.status);newsData=await a.json();stockData=await b.json();renderCategories();renderNews();renderStocks();updateStatus();clock()}catch(e){document.getElementById("newsList").innerHTML=`<div class="status error">데이터를 불러오지 못했습니다: ${esc(e.message)}</div>`}}
function clock(){document.getElementById("updateTime").textContent="Update : "+new Date().toLocaleString("ko-KR",{hour12:false})}
window.addEventListener("load",loadData);setInterval(loadData,60000);setInterval(clock,1000);
</script></body></html>
