  :root{

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text-0);font-family:var(--font-ui);}

  .app-top{position:sticky;top:0;z-index:50;}

  .mode-switch{
    background:var(--navy-2);display:flex;gap:0;padding:0 24px;
  }
  .mode-tab{
    color:#9fb0c4;font-size:14px;font-weight:800;cursor:pointer;
    padding:12px 20px;border-bottom:3px solid transparent;
    display:flex;align-items:center;gap:6px;
    transition:color .15s ease, border-color .15s ease;
  }
  .mode-tab:hover{color:#fff;}
  .mode-tab.active{color:#fff;background:var(--navy);}

  .topnav{
    background:var(--navy);color:#fff;
    display:flex;align-items:center;gap:22px;
    padding:12px 24px;flex-wrap:wrap;
  }
  .nav-tabs{display:flex;gap:20px;flex:1;flex-wrap:wrap;}
  .nav-tab{
    color:#c7cedb;font-size:14px;font-weight:700;cursor:pointer;
    padding:4px 2px;border-bottom:2px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .nav-tab:hover{color:#fff;}
  .nav-tab.active{color:var(--green);}

  .grid{
    max-width:1100px;margin:16px auto 60px;padding:0 24px;
    display:grid;grid-template-columns:repeat(auto-fit, minmax(420px, 1fr));
    gap:20px;
  }

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    display:flex;overflow:hidden;
    box-shadow:0 1px 3px rgba(20,30,50,.06);
  }
  .card-body{padding:16px 18px;flex:1;min-width:0;display:flex;flex-direction:column;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-title{font-size:16px;font-weight:700;margin:0;}
  .title-link{color:inherit;text-decoration:none;}
  .title-link:hover{color:var(--blue);text-decoration:underline;}
  .rating{
    flex-shrink:0;font-size:13px;font-weight:800;color:var(--navy);
    display:flex;align-items:center;gap:3px;white-space:nowrap;
  }
  .rating.pending{color:var(--blue);font-weight:700;font-size:12px;}
  .meta-line{font-size:12px;color:var(--text-2);margin:4px 0 10px;}
  .genre-tag{
    display:inline-block;background:var(--bg);border:1px solid var(--border);
    color:var(--text-1);font-size:11px;padding:2px 8px;border-radius:10px;margin-right:5px;
  }
  .synopsis{font-size:13px;line-height:1.6;color:var(--text-1);margin:0 0 10px;flex:1;}
  .card-footer{border-top:1px solid var(--border);padding-top:10px;display:flex;justify-content:space-between;align-items:center;}
  .more-btn{
    background:none;border:none;color:var(--blue);font-size:13px;font-weight:700;
    cursor:pointer;padding:0;
  }
  .more-btn:hover{text-decoration:underline;}

  .icon-links{display:flex;gap:8px;}
  .icon-btn{
    display:flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:50%;
    background:var(--bg);border:1px solid var(--border);
    color:var(--text-1);font-size:13px;text-decoration:none;
    cursor:pointer;transition:all .15s ease;
  }
  .icon-btn:hover{border-color:var(--blue);color:var(--blue);}
  .icon-btn.active-icon{background:var(--blue);border-color:var(--blue);color:#fff;}

  .expand{
    display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);
    font-size:12.5px;color:var(--text-1);line-height:1.7;
  }
  .expand.open{display:block;}
  .expand b{color:var(--text-0);}
  .expand .site-link{
    display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;
    color:var(--blue);text-decoration:none;
  }
  .expand .site-link:hover{text-decoration:underline;}

  .empty-msg{max-width:1100px;margin:40px auto;padding:0 24px;color:var(--text-1);font-size:14px;text-align:center;}

  @media (max-width: 560px){
    .grid{grid-template-columns:1fr;}
  }
</style>

let modeKey = "movie";
let catIndex = 0;
const scrollPositions = {};

function scrollKey(){ return modeKey + ":" + catIndex; }

function saveScrollPosition(){
  scrollPositions[scrollKey()] = window.scrollY;
}

function restoreScrollPosition(){
  const y = scrollPositions[scrollKey()] || 0;
  window.scrollTo({top:y, behavior:"auto"});
}

function currentMode(){ return MODES[modeKey]; }
function currentOrder(){ return currentMode().categoryOrder; }
function currentCatKey(){ return currentOrder()[catIndex]; }
function currentCat(){ return currentMode().data[currentCatKey()]; }

function renderModeSwitch(){
  const wrap = document.getElementById("modeSwitch");
  wrap.innerHTML = "";
  Object.keys(MODES).forEach(key=>{
    const tab = document.createElement("div");
    tab.className = "mode-tab" + (key === modeKey ? " active" : "");
    tab.textContent = MODES[key].modeLabel;
    tab.onclick = ()=>{ saveScrollPosition(); modeKey = key; catIndex = 0; renderAll(); restoreScrollPosition(); };
    wrap.appendChild(tab);
  });
}

function renderNavTabs(){
  const wrap = document.getElementById("navTabs");
  wrap.innerHTML = "";
  currentOrder().forEach((key, i)=>{
    const tab = document.createElement("div");
    tab.className = "nav-tab" + (i === catIndex ? " active" : "");
    tab.textContent = currentMode().data[key].label;
    tab.onclick = ()=>{ saveScrollPosition(); catIndex = i; renderAll(); restoreScrollPosition(); };
    wrap.appendChild(tab);
  });
}

function renderGrid(){
  const items = currentCat().items;
  const labels = FIELD_LABELS[modeKey];
  const grid = document.getElementById("grid");
  const emptyMsg = document.getElementById("emptyMsg");
  grid.innerHTML = "";

  if(items.length === 0){
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  items.forEach((item, idx)=>{
    const card = document.createElement("div");
    card.className = "card";
    const ratingHtml = item.rating
      ? `<div class="rating">${item.rating.toFixed(1)} ★</div>`
      : `<div class="rating pending">Coming Soon</div>`;
    const genreTags = item.genres.map(g=>`<span class="genre-tag">${g}</span>`).join("");
    const plotHtml = item.plot.join(" ");
    const expandId = "exp_" + idx + "_" + modeKey + "_" + catIndex;

    card.innerHTML = `
      <div class="card-body">
        <div class="card-top">
          <h3 class="card-title"><a class="title-link" href="${siteSearchUrl(item.name)}" target="_blank" rel="noopener">${item.name}</a></h3>
          ${ratingHtml}
        </div>
        <div class="meta-line">${genreTags} · ${item.year}</div>
        <p class="synopsis">${plotHtml}</p>
        <div class="card-footer">
          <button class="more-btn" data-target="${expandId}">More Info ▾</button>
          <div class="icon-links">
            <a class="icon-btn" href="${siteSearchUrl(item.name)}" target="_blank" rel="noopener" title="Official Site">🔗</a>
          </div>
        </div>
        <div class="expand" id="${expandId}">
          <div><b>${labels.p1}</b> — ${item.setting}</div>
          <div><b>${labels.p2}</b> — ${item.director}</div>
          <div><b>${labels.p3}</b> — ${item.lead}</div>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll(".more-btn").forEach(btn=>{
    btn.onclick = ()=>{
      const target = document.getElementById(btn.dataset.target);
      const isOpen = target.classList.toggle("open");
      btn.textContent = isOpen ? "Less Info ▴" : "More Info ▾";
    };
  });
}

function renderAll(){
  renderModeSwitch();
  renderNavTabs();
  renderGrid();
}

renderAll();
</script>
